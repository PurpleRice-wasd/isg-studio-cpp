name: 功能建议
description: 希望增加或改进的功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述使用场景和当前的困难，而不是只写一个功能名。
      placeholder: |
        我在...的时候，希望能...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 如果有具体的交互或实现想法，可以写在这里。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过现有 Issue，没有重复
          required: true
        - label: 这个功能不需要在 Issue 里附加私人信息或课件正文
          required: true
