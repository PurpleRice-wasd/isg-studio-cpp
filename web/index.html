<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: isg:; frame-src file: isg:; connect-src 'none'; object-src 'none'">
<title>讲练一体工作台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">

  <aside class="nav" aria-label="主导航栏">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>讲练一体工作台</b>
        <small>课件 → 学习页</small>
      </span>
    </div>

    <nav class="navlist">
      <a class="navitem" href="#workbench" data-route="workbench">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        <span>工作台</span>
      </a>
      <a class="navitem" href="#run" data-route="run">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
        <span>运行</span>
        <i class="navdot" hidden></i>
      </a>
      <a class="navitem" href="#result" data-route="result">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <span>结果</span>
      </a>
      <a class="navitem" href="#settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 14h5M9.5 8h5M17.5 16h5"/></svg>
        <span>设置</span>
      </a>
      <a class="navitem" href="#about" data-route="about">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 100-18 9 9 0 000 18z"/><path d="M12 16.5v-4.8M12 8h.01"/></svg>
        <span>关于</span>
      </a>
    </nav>

    <div class="nav-foot">
      <button type="button" class="themebtn" id="themeBtn" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="themeIcon"><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4L7 17M17 7l1.4-1.4"/><path d="M12 16.5a4.5 4.5 0 100-9 4.5 4.5 0 000 9z"/></svg>
        <span id="themeLabel">跟随系统</span>
      </button>
      <div class="nav-ver" id="navVersion">v—</div>
    </div>
  </aside>

  <main class="main" id="viewRoot" tabindex="-1"></main>

</div>

<div class="drop-overlay" id="dropOverlay" aria-hidden="true">
  <div class="drop-overlay-inner">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    <b>松手即可选中课件</b>
    <span>支持 .pptx / .pdf / .txt / .md</span>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="logic/probe-parse.js"></script>
<script src="isg-bridge.js"></script>
<script src="logic/logic-bundle.js"></script>
<script src="logic/pipeline-host.js"></script>
<script src="views/workbench.js"></script>
<script src="views/extract.js"></script>
<script src="views/run.js"></script>
<script src="views/result.js"></script>
<script src="views/settings.js"></script>
<script src="views/about.js"></script>
<script src="app.js"></script>
</body>
</html>
